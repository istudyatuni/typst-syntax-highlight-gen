[package]
name = "typst-highlight-gen"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gen"
path = "src/main.rs"

[[bin]]
name = "compare"
path = "bin/compare.rs"
required-features = ["compare"]

[features]
compare = ["dep:similar-asserts", "dep:yaml_serde"]

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_pretty = "0.1.0"
similar-asserts = { version = "2.0.0", optional = true }
typst-library = "0.14.2"
yaml_serde = { version = "0.10.4", optional = true }
